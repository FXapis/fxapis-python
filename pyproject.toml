[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fxapis"
version = "0.1.1"
description = "MT5 Python SDK for fxapis, the hosted MetaTrader 5 REST API: trade MT5 accounts with no terminal, VPS or EA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "El Wizard", email = "mago@elwizard.net" }]
keywords = [
  "mt5",
  "mt5-api",
  "metatrader",
  "metatrader5",
  "metatrader-5",
  "mt5 python",
  "trading-api",
  "forex",
  "forex-api",
  "copy-trading",
  "trade-copier",
  "algorithmic-trading",
  "rest-api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://fxapis.com"
Documentation = "https://docs.fxapis.com"
"API reference" = "https://docs.fxapis.com/api-reference"
Repository = "https://github.com/FXapis/fxapis-python"
Issues = "https://github.com/FXapis/fxapis-python/issues"
Examples = "https://github.com/FXapis/fxapis-examples"
Changelog = "https://docs.fxapis.com/changelog"

[tool.hatch.build.targets.wheel]
packages = ["src/fxapis"]

[tool.hatch.build.targets.sdist]
include = ["src/fxapis", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/fxapis"]
